<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriFarmers - Login</title>
  <style>
    :root {
      --bg-color: #f4f7f4;
      --card-bg: #ffffff;
      --primary: #2d5a27; /* Darker green matching the generated mockup */
      --primary-hover: #1e3e1a;
      --text-main: #1d211d;
      --text-muted: #667060;
      --border: #dce3dc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 400px;
      padding: 40px 32px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      text-align: center;
    }

    .brand {
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 100px;
      height: 100px;
      margin-bottom: 12px;
      object-fit: contain;
      border-radius: 50%;
    }

    .brand h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    /* Italicized Catchphrase */
    .tagline {
      font-size: 0.95rem;
      font-style: italic;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 4px;
      margin-bottom: 12px;
    }

    .sub-title {
      font-size: 0.9rem;
      color: #8a9485;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(45, 90, 39, 0.15);
    }

    .forgot-links {
      display: flex;
      justify-content: space-between;
      margin-top: -4px;
      margin-bottom: 24px;
    }

    .forgot-links a {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .forgot-links a:hover {
      color: var(--primary);
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-login:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>

  <main class="login-container">
    <header class="brand">
      <img 
        src="logo.png.jpeg" 
        alt="AgriFarmers Logo" 
        class="brand-logo"
      >
      <h1>AgriFarmers</h1>
      <p class="tagline">where good food begins</p>
      <p class="sub-title">Sign in to your account</p>
    </header>

    <form action="#" method="POST">
      <div class="form-group">
        <label for="userId">User ID</label>
        <input 
          type="text" 
          id="userId" 
          name="userId" 
          placeholder="Enter your user ID" 
          required 
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Enter your password" 
          required 
          autocomplete="current-password"
        >
      </div>

      <div class="forgot-links">
        <a href="#forgot-id">Forgot User ID?</a>
        <a href="#forgot-password">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-login">Log In</button>
    </form>
  </main>

</body>
</html>
