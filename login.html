<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriFarmers - Login</title>
  <style>
    :root {
      --bg-color: #f4f7f4;
      --card-bg: #ffffff;
      --primary: #2d5a27;
      --primary-hover: #1e3e1a;
      --text-main: #1d211d;
      --text-muted: #667060;
      --border: #dce3dc;
      --icon-color: #4a6b40;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 20px;
    }

    .login-container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 36px 28px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      text-align: center;
    }

    .brand {
      margin-bottom: 24px;
    }

    .brand-logo {
      width: 85px;
      height: 85px;
      margin-bottom: 8px;
      object-fit: cover;
      border-radius: 50%;
    }

    .brand h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .tagline {
      font-size: 0.9rem;
      font-style: italic;
      color: var(--text-muted);
      margin-top: 2px;
      margin-bottom: 12px;
    }

    .page-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      margin-top: 10px;
      position: relative;
      display: inline-block;
      padding-bottom: 6px;
    }

    .page-title::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 3px;
      background-color: var(--primary);
      border-radius: 2px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 14px;
      position: relative;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper svg.left-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      fill: var(--icon-color);
      pointer-events: none;
    }

    .input-wrapper svg.right-icon {
      position: absolute;
      right: 14px;
      width: 18px;
      height: 18px;
      fill: var(--icon-color);
      cursor: pointer;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 42px 12px 42px;
      font-size: 0.92rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background-color: #fff;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .input-wrapper input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(45, 90, 39, 0.12);
    }

    .forgot-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      margin-bottom: 20px;
      font-size: 0.82rem;
    }

    .forgot-links button {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      font-size: inherit;
      padding: 0;
    }

    .forgot-links button:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .signup-redirect {
      margin-top: 18px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .signup-redirect a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    .signup-redirect a:hover {
      text-decoration: underline;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* Modal Content Box */
    .modal-box {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 380px;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      transform: translateY(-10px);
      transition: transform 0.25s ease;
      text-align: left;
    }

    .modal-overlay.active .modal-box {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-header h3 {
      font-size: 1.1rem;
      color: var(--primary);
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
    }

    .modal-body p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 9px 16px;
      border-radius: 6px;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background-color: #f0f3f0;
    }

    .btn-modal-primary {
      background-color: var(--primary);
      border: none;
      color: #fff;
      padding: 9px 16px;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-modal-primary:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>

  <main class="login-container">
    <header class="brand">
      <img src="logo.png.jpeg" alt="AgriFarmers Logo" class="brand-logo">
      <h1>AgriFarmers</h1>
      <p class="tagline">"Where Good Food Begins"</p>
      <h2 class="page-title">Welcome Back</h2>
    </header>

    <form id="loginForm" action="#" method="POST">
      <!-- 1. Email / Mobile No. -->
      <div class="form-group">
        <div class="input-wrapper">
          <svg class="left-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          <input type="text" id="contactInfo" name="contactInfo" placeholder="Enter your email/mobile no." required autocomplete="username">
        </div>
      </div>

      <!-- 2. Password (with Eye Icon) -->
      <div class="form-group">
        <div class="input-wrapper">
          <svg class="left-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required autocomplete="current-password">
          <svg class="right-icon toggle-password" data-target="loginPassword" viewBox="0 0 24 24">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
          </svg>
        </div>
      </div>

      <!-- Forgot Links -->
      <div class="forgot-links">
        <button type="button" id="openForgotEmail">Forgot email?</button>
        <button type="button" id="openForgotPassword">Forgot password?</button>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit">Login</button>
    </form>

    <!-- Sign up Redirect Link -->
    <p class="signup-redirect">
      Don't have an account? <a href="index.html">Create Account</a>
    </p>
  </main>

  <!-- Forgot Email Modal -->
  <div class="modal-overlay" id="emailModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Find Your Email</h3>
        <button class="close-btn" data-close="emailModal">&times;</button>
      </div>
      <div class="modal-body">
        <p>Enter your registered mobile number to receive your account email address via SMS.</p>
        <div class="form-group">
          <div class="input-wrapper">
            <svg class="left-icon" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
            <input type="tel" placeholder="Enter mobile number">
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" data-close="emailModal">Cancel</button>
        <button type="button" class="btn-modal-primary">Send Email</button>
      </div>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal-overlay" id="passwordModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Reset Password</h3>
        <button class="close-btn" data-close="passwordModal">&times;</button>
      </div>
      <div class="modal-body">
        <p>Enter your email address or mobile number to receive a password reset link or OTP.</p>
        <div class="form-group">
          <div class="input-wrapper">
            <svg class="left-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            <input type="text" placeholder="Enter email/mobile no.">
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" data-close="passwordModal">Cancel</button>
        <button type="button" class="btn-modal-primary">Send Reset Link</button>
      </div>
    </div>
  </div>

  <script>
    // Password Toggle
    document.querySelectorAll('.toggle-password').forEach(icon => {
      icon.addEventListener('click', function () {
        const targetId = this.getAttribute('data-target');
        const inputField = document.getElementById(targetId);

        if (inputField.type === 'password') {
          inputField.type = 'text';
          this.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2z"/>';
        } else {
          inputField.type = 'password';
          this.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
        }
      });
    });

    // Modal Control Functions
    const emailModal = document.getElementById('emailModal');
    const passwordModal = document.getElementById('passwordModal');

    document.getElementById('openForgotEmail').addEventListener('click', () => emailModal.classList.add('active'));
    document.getElementById('openForgotPassword').addEventListener('click', () => passwordModal.classList.add('active'));

    // Close Modals via Close/Cancel Buttons
    document.querySelectorAll('[data-close]').forEach(button => {
      button.addEventListener('click', () => {
        const modalId = button.getAttribute('data-close');
        document.getElementById(modalId).classList.remove('active');
      });
    });

    // Close Modal by clicking outside of modal-box
    window.addEventListener('click', (e) => {
      if (e.target.classList.contains('modal-overlay')) {
        e.target.classList.remove('active');
      }
    });
  </script>

</body>
</html>
